# Grafana grants anonymous Admin access; publish monitoring ports on loopback only.
services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: pcsm-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - default
      - metrics

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: pcsm-grafana
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./grafana-board.json:/var/lib/grafana/dashboards/pcsm.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

networks:
  metrics:
    external: true
    name: pcsm-metrics
