    memswap_limit: 4g
    environment:
      - GLIBC_TUNABLES=glibc.cpu.hwcaps=-SHSTK
      - PERCONA_TELEMETRY_DISABLE=1
    ports: ["127.0.0.1:30001:30001"]
    volumes: ["rs01:/data/db", "./mongo/:/cfg:ro"]
    command:
      [
        "-f",
        "/cfg/mongod.conf",
        "--replSet=rs0",
        "--port=30001",
        "--setParameter=enableTestCommands=1",
      ]

  rs02:
