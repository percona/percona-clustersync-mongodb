name: reviewdog

on: [pull_request]

jobs:
  misspell:
    name: misspell
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.changed_files < 301 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: misspell
        uses: reviewdog/action-misspell@d6429416b12b09b4e2768307d53bef58d172e962 # v1.27.0
        with:
          reporter: github-pr-review
          locale: "US"

  alex:
    name: alex
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.changed_files < 301 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: alex
        uses: reviewdog/action-alex@347481655add010a2ae302df34b57c9bcfa0d6e4 # v1.17.0
        with:
          reporter: github-pr-review
