name: Go-code

on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - run: go test -race -v ./...

  gofmt:
    name: gofmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - run: go install golang.org/x/tools/cmd/goimports@v0.49.0
      - run: go install mvdan.cc/gofumpt@v0.11.0
      # - run: go install github.com/segmentio/golines@latest
      - run: goimports -w -local "github.com/percona" .
      - run: gofumpt -w -extra .
      # - run: golines -w --shorten-comments --chain-split-dots -m 100 .
      - uses: reviewdog/action-suggester@2558ba17e65a9039e73764a73009fc05fef28a46 # v1.24.3
        with:
          tool_name: gofmt

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2.10.0
        with:
          reporter: github-pr-review
          level: error
          golangci_lint_version: "v2.13.2"
          reviewdog_version: "v0.21.0"

  integration-test:
    name: Integration (MongoDB ${{ matrix.mongo_version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mongo_version: ["6.0.29-23", "7.0.40-22", "8.0.29-13"]
    env:
      MONGO_VERSION: ${{ matrix.mongo_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - run: make test-integration
